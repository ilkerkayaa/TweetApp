{% extends "base.html" %}

{% block content%}
    
    <div class="container" style="width: 50%;">
        {% for tweet in tweets%}
            <div class="card" style= "padding: 10px;">
                <div class="card-header" style="background-color: rgb(78, 78, 255);">
                   <h5 class="card-title" >{{tweet.nickname}}</h5>
                </div>
                <div class="card-body">
                    <p class="card-text">{{tweet.message}}</p>
                </div>
            </div>
        {% endfor %}
    </div>

{% endblock %}
