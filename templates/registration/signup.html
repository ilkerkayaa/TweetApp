{% extends "base.html" %}

{% block content %}


 <form  method="POST" action="">
    {% csrf_token %}
    {% if form.non_field_errors %}
    <div class="alert alert-danger">
        {{ form.non_field_errors }}
    </div>
    {% endif %}
    {% for field in form %}
    <div class="mb-3">
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
    </div>
    {% endfor %}
<button type="submit" class="btn btn-primary" value="signup">Signup</button>
</form>


{% endblock %}
